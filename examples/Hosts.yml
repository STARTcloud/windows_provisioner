# core_provisioner_version: 0.2.16
# provisioner_name: windows_provisioner
# provisioner_version: 0.1.23 # x-release-please-version
#
# Example Hosts.yml for a STARTcloud Windows Server machine (VirtualBox, DHCP).
# Copy to the repository root as Hosts.yml (gitignored) and adjust:
#   cp examples/Hosts.yml Hosts.yml
# Append the startcloud.startcloud_roles you need under roles: (see metadata.roles in provisioner.yml).
---
hosts:
  -
    settings:
      # Vagrant Debug
      debug_build: true

      # Identifiers
      hostname: windows
      domain: example.com
      server_id: '1234'

      # Extra Actions
      ## This calls extra things after Ansible completes, like syncing the new SSH key from the lockdown role, or the id_files or the support bundle
      post_provision: true

      # Resources
      vcpus: 2
      memory: 8G

      # Console Access
      consoleport: 1234
      consolehost: 0.0.0.0
      show_console: false

      # Box information
      box: 'STARTcloud/windows2022-server'
      box_url: 'https://boxvault.startcloud.com'
      box_version: 2025.5.7
      box_arch: amd64

      # Provider Specific Settings
      provider_type: virtualbox
      os_type: 'Windows10_64'
      firmware_type: UEFI

      # Setup Variables
      setup_wait: 420

      # Vagrant Configurations
      vagrant_user: Administrator
      vagrant_user_pass: 'STARTcloud24@!'
      vagrant_user_private_key_path: ./id_rsa
      vagrant_ssh_insert_key: true
      vagrant_ssh_forward_agent: true
      vagrant_ssh_keep_alive: true
      vagrant_communicator: ssh

    plugins:
      install:
        -
          name: vagrant-scp-sync
          version: latest
#        -
#          name: vagrant-zones
#          version: latest
      remove:
        -
          name: vagrant-scp

    zones:
      vmtype: production
      brand: bhyve
      on_demand_vnics: true
      post_provision_boot: true
      console_onboot: false
      console: webvnc
      debug: false
      debug_boot: false
      hostbridge: i440fx
      acpi: true
      autostart: true
      setup_method: zlogin
      diskif: virtio
      netif: virtio-net-viona
      booted_string: 'Web console:'
      lcheck_string: ':~$'
      alcheck_string: 'login:'
      safe_restart: 'sudo shutdown -r'
      safe_shutdown: 'sudo init 0 || true'
      clean_shutdown_time: 200
      snapshot_script: '/opt/vagrant/bin/Snapshooter.sh'
      cpu_configuration: simple

    networks:
      -
        type: external
        address: 192.168.255.255
        netmask: 255.255.255.0
        gateway: 192.168.2.1
        autoconf: false
        vlan:
        dhcp4: true
        dhcp6: false
        is_control: false
        route: default
        provisional: false
        bridge:
        nic_type: virtio
        mac: auto
        dns:
          - nameserver: 1.1.1.1
          - nameserver: 1.0.0.1

    disks:
      boot:
        type: template
        volume_name: boot
        mount: /

    provisioning:
      shell:
        enabled: false
        #scripts:
        #  - provisioners/scripts/winrm.ps1

      ansible:
        enabled: true
        playbooks:
          - remote:
              -
                description: "This playbook configures the machine using the generated playbook: /vagrant/ansible/playbook.yml"
                playbook: provisioners/ansible/playbook.yml
                ansible_python_interpreter: /usr/bin/python3
                compatibility_mode: 2.0
                install_mode: pip
                ssh_pipelining: true
                verbose: false
                callbacks: profile_tasks
                run: once
                remote_collections: false
                collections:
                  - startcloud.startcloud_roles
#                  - startcloud.hcl_roles

    folders:
      -
        description: "Disables VBoxSF, do not enable"
        map: .
        to: /vagrant
        type: virtualbox
        disabled: true
        automount: true

      -
        description: "Directory for Ansible Scripts"
        map: ./provisioners/ansible/
        to: /cygdrive/c/vagrant/ansible/
        owner: Administrator
        type: rsync
        args:
          - '--verbose'
          - '--archive'
          - '--delete'
          - '-z'
          - '--copy-links'

    vars:
      # Secrets Override: If you don't want to use a secrets file you can override secrets here
      # Uncomment and fill in these lines if you want to download the installers for this instance
      # Note that the installer names must match the names on the download server.
      # secrets:
      #   installer_base_url: "https://XXXXXXXXX.XXXXXXXXX.XXX"
      #   installer_url_user: "XXXXXXXXXXXX@XXXXXXXXXXX"
      #   installer_url_pass: "XXXXXXXXXXXX"

      ## Provisioner Debug
      debug_all: true

      ## SSL
      selfsigned_enabled: true
      haproxy_ssl_redirect: true
      letsencrypt_enabled: false
      letsencrypt_staging_enabled: false

      ## Use Proxy for downloads and updates
      use_proxy: false
      proxy_server: 255.255.255.255
      proxy_port: 3128

      ## Hosts entries for /etc/hosts
      # etc_hosts_entries:
      #   - hostname:
      #     aliases:
      #       -
      #     ip:

    roles:
      - name: startcloud.startcloud_roles.setup
      - name: startcloud.startcloud_roles.networking
        tags: always
      - name: startcloud.startcloud_roles.disks
      - name: startcloud.startcloud_roles.hostname
      - name: startcloud.startcloud_roles.dependencies
      - name: startcloud.startcloud_roles.service_user
      - name: startcloud.startcloud_roles.ssl
      # Windows provisioner: append the roles you need from metadata.roles in
      # provisioner.yml (include each role's depends_on chain first), e.g.:
      # - name: startcloud.startcloud_roles.chocolatey
      # - name: startcloud.startcloud_roles.windows_privacy
      # - name: startcloud.startcloud_roles.remote_access
      # - name: startcloud.hcl_roles.domino_notes_install
      - name: startcloud.startcloud_roles.lockdown
        vars:
          run_tasks: true
          lockdown_new_password: 'STARTcloud24@!'
